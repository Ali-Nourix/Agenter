<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenter context bar preview</title>
  <link rel="stylesheet" href="obsidian-theme.css">
  <link rel="stylesheet" href="obsidian-controls.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #141414; color: var(--text-normal); font-family: var(--font-ui); display: flex; justify-content: center; }
    .stack { display: flex; flex-direction: column; gap: 18px; width: 470px; }
    .card { border: 1px solid var(--background-modifier-border); border-radius: 12px; background: var(--background-primary); overflow: visible; padding: 14px 0 12px; }
    .card h4 { margin: 0 14px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); }
    .agenter-root { all: unset; }
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .msgs { display: flex; flex-direction: column; gap: 10px; padding: 0 14px; }
  </style>
</head>
<body>
  <div class="stack agenter-root" id="stack"></div>
  <script src="meter-preview.bundle.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("light")) document.body.classList.add("light");
    const { ContextMeter } = window.AgenterPreview;
    const stack = document.getElementById("stack");
    const snap = (used, window_, over = {}) => ({
      window: window_, used, fraction: used / window_, level: used / window_ >= 0.95 ? "full" : used / window_ >= 0.85 ? "high" : used / window_ >= 0.7 ? "warn" : "ok",
      source: "reported", windowSource: "known", reserve: 16000, trigger: Math.floor(window_ * 0.8), autoCompact: true, maxOutput: 64000,
      breakdown: { system: 520, tools: 2900, history: used - 3420 - 300, pending: 300 }, ...over,
    });
    const card = (title) => { const c = document.createElement("div"); c.className = "card"; c.innerHTML = `<h4>${title}</h4>`; stack.appendChild(c); return c; };
    const row = (parent) => { const r = document.createElement("div"); r.className = "agenter-ctxmeter-row"; parent.appendChild(r); return r; };

    const states = [
      ["Calm", snap(21400, 200000)],
      ["Estimated (before the first answer)", snap(3800, 200000, { source: "estimated" })],
      ["Getting full", snap(150000, 200000)],
      ["Nearly full", snap(176000, 200000)],
      ["Full", snap(194000, 200000)],
    ];
    for (const [title, s] of states) {
      const c = card(title);
      const m = new ContextMeter(row(c), {});
      m.update(s, { model: "Example provider · large-model" });
    }
    const compact = card("Compact (contextual popover)");
    const mc = new ContextMeter(row(compact), { compact: true });
    mc.update(snap(61000, 128000), {});

    const open = card("Details");
    const mo = new ContextMeter(row(open), { onCompact() {}, onNewChat() {}, onReport() {} });
    mo.update(snap(113000, 200000), { model: "Example provider · large-model" });
    if (params.has("open")) mo.el.querySelector("button").click();

    const msgs = card("Messages, notices, attachments");
    const wrap = document.createElement("div"); wrap.className = "msgs"; msgs.appendChild(wrap);
    const copy = `<button class="agenter-msg-copy" type="button" aria-label="Copy message" style="opacity:1"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`;
    wrap.innerHTML = `
      <div class="agenter-msg agenter-msg-user"><div class="agenter-bubble">Summarize the attached report and the chart.</div>${copy}</div>
      <div class="agenter-notice is-compact"><span class="agenter-notice-icon"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></span><span class="agenter-notice-text">Context compacted: 171k → 64k tokens. cleared old tool output (41k tokens); summarized 18 earlier messages (22k → 1k tokens).</span></div>
      <div class="agenter-notice is-retry"><span class="agenter-notice-icon"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg></span><span class="agenter-notice-text">The provider is limiting requests. Trying again in 4s (2/5)…</span></div>
      <div class="agenter-notice is-warning"><span class="agenter-notice-icon"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg></span><span class="agenter-notice-text">The model used its whole output limit before writing an answer.</span></div>
      <div class="agenter-msg agenter-msg-assistant"><div class="agenter-avatar">A</div><div class="agenter-bubble"><p>Revenue grew <strong>12%</strong> quarter over quarter; the chart shows the growth came from the second half.</p></div>${copy}</div>
      <div class="agenter-attachment-strip has-items" style="padding:0">
        <div class="agenter-attachment-chip is-native"><span class="agenter-attachment-icon"><svg viewBox="0 0 24 24" width="13" height="13"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span><span class="agenter-attachment-name">chart.png</span><span class="agenter-attachment-size">212 KB</span><span class="agenter-attachment-plan"></span><button type="button" aria-label="Remove chart.png">×</button></div>
        <div class="agenter-attachment-chip is-text"><span class="agenter-attachment-icon"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span><span class="agenter-attachment-name">report-q3.pdf</span><span class="agenter-attachment-size">1.4 MB</span><span class="agenter-attachment-plan">as text</span><button type="button" aria-label="Remove report-q3.pdf">×</button></div>
        <div class="agenter-attachment-chip is-listed"><span class="agenter-attachment-icon"><svg viewBox="0 0 24 24" width="13" height="13"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span><span class="agenter-attachment-name">photo.jpg</span><span class="agenter-attachment-size">3.1 MB</span><span class="agenter-attachment-plan">cannot see</span><button type="button" aria-label="Remove photo.jpg">×</button></div>
      </div>`;
  </script>
</body>
</html>
